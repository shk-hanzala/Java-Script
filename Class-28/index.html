
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My To-Do List</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <div class="container">
        <header class="header">
            <div class="logo">✓</div>
            <h1>My To-Do List</h1>
            <p>Organize your day, achieve your goals.</p>
        </header>

        <div class="stats">
            <div class="stat-card">
                <span>Total Tasks</span>
                <h2 id="totalTasks">0</h2>
            </div>

            <div class="stat-card">
                <span>Completed</span>
                <h2 id="completedTasks">0</h2>
            </div>

            <div class="stat-card">
                <span>Pending</span>
                <h2 id="pendingTasks">0</h2>
            </div>
        </div>
        
        <form id="todoForm" class="input-area">
            <input
            type="text"
            id="taskInput"
            placeholder="What do you need to do?"
                autocomplete="off"
                >
            <button type="submit" class="add-btn">+ Add Task</button>
        </form>

        <div class="filters">
            <button class="filter-btn active" data-filter="all">All</button>
            <button class="filter-btn" data-filter="pending">Pending</button>
            <button class="filter-btn" data-filter="completed">Completed</button>
        </div>

        <ul id="taskList" class="task-list"></ul>

        <p id="emptyMessage" class="empty-message">
            ✨ No tasks yet. Add your first task!
        </p>

        <footer>
            Stay focused. Keep growing. 🚀
        </footer>
    </div>
    
    <script src="script.js" defer></script>
</body>
</html>
