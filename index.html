<!DOCTYPE html>
<html lang="en">

<head>
    <title>Document</title>
    <style>
        body {
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            padding: 30px;
        }

        .btn {
            display: grid;
            grid-auto-flow: column;
            grid-template-rows: repeat(10, auto);
            gap: 14px 24px;
            padding: 10px;
        }

        .btn a {
            text-decoration: none;
        }

        .btn button {
            width: 160px;
            padding: 12px 10px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #007BFF, #0056b3);
            color: white;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 3px 6px rgba(0, 91, 179, 0.35);
            transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
        }

        .btn button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0, 91, 179, 0.45);
            background: linear-gradient(135deg, #0069e0, #003f8a);
        }

        .btn button:active {
            transform: translateY(0);
            box-shadow: 0 2px 4px rgba(0, 91, 179, 0.4);
        }
    </style>
</head>
